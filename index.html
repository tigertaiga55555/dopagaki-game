<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0620" />

    <!-- AdSense所有権確認用。広告コード・広告ユニットは追加していない。 -->
    <meta name="google-adsense-account" content="ca-pub-5712444032207863">

    <!-- Ver.5.0追加: Google Analytics 4（測定ID G-1BRJXLJ9P7）。gtag('config', ...)が
         ページ読み込み時に通常のpage_viewを自動送信する（このSPAは画面遷移をURL遷移では
         なくReactのstate切り替えで行うため、追加のvirtual pageview送信は行っていない）。
         UTMパラメータ（utm_source/utm_medium/utm_campaign等）はURLのクエリ文字列に
         残ったままこのpage_viewが送信されるため、GA4標準機能でそのまま計測できる
         （アプリ側はwindow.location.searchを読み取るだけで書き換えないため、
         ?preview=...や?v=...等の既存クエリと同様、UTMパラメータもそのままGA4へ渡る）。
         個人情報は一切送信していない（自動収集される標準パラメータとカスタムイベント名・
         final_percentのみ）。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BRJXLJ9P7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-1BRJXLJ9P7');
    </script>

    <title>ドパガキゲーム｜60秒でドパガキ度100％を目指せ</title>
    <meta name="description" content="60秒でドパガキ度100％を目指せ。反射神経・判断力・我慢できなさが試される超高速ミニゲーム。" />

    <!-- OGP（LINE/X/Discord/iMessageなどのリンクプレビュー用。crawlerはJS実行後のDOMを見ないため、
         React実行前の初期HTMLにすべて存在させる必要がある）。
         Ver.5.0追加修正: LINEのリンクプレビューに、現行のゲーム内容とは無関係な旧タイトルの
         文言がキャッシュされたまま表示される不具合を確認した。og:description/twitter:descriptionが
         titleやmeta descriptionと微妙に異なる文言だったのを含め、title/description/OG/Twitterを
         すべて同一内容へ統一し、og:image/twitter:imageのファイル名にバージョン番号を付与して
         （og-image.png→og-image-v5.png）、クローラーのキャッシュを新しいURLとして確実に
         再取得させるようにした。 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dopagaki-game.vercel.app" />
    <meta property="og:title" content="ドパガキゲーム｜60秒でドパガキ度100％を目指せ" />
    <meta property="og:description" content="60秒でドパガキ度100％を目指せ。反射神経・判断力・我慢できなさが試される超高速ミニゲーム。" />
    <meta property="og:image" content="https://dopagaki-game.vercel.app/og-image-v5.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ドパガキゲーム｜60秒でドパガキ度100％を目指せ" />
    <meta name="twitter:description" content="60秒でドパガキ度100％を目指せ。反射神経・判断力・我慢できなさが試される超高速ミニゲーム。" />
    <meta name="twitter:image" content="https://dopagaki-game.vercel.app/og-image-v5.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
