name = "dopagaki-game"
compatibility_date = "2026-10-21"
main = "src/worker/index.ts"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# ASSETSバインディング（次フェーズ、item 82）: Workerのfetchハンドラから、静的アセット
# （SPA本体）への配信を明示的に呼び出せるようにする。/s/:idをrun_worker_firstへ追加した
# ことで、Workerが自分で「クローラーでなければ普段通りSPAを返す」判断をしなければ
# ならなくなったため必要（env.ASSETS.fetch(request)、worker/index.ts参照）。
binding = "ASSETS"
# Ver.6 Phase 5.1（Challengeバックエンド基盤）: /api/* だけをWorkerスクリプトへ渡す。
# これ以外の全パス（既存のSPA本体）は従来どおり静的アセット優先のまま、一切挙動を変えない。
#
# 次フェーズ（ゲーム機能クローズラウンド、item 82）: /s/*（X結果シェアURL）もここへ追加した。
# X等のリンクプレビュー用クローラーにだけ、OGPカード（og:title/description/image、
# 実際のDOPA%/STREAK入り）をWorker側で返すため——/api/*以外は元々Workerを一切経由せず
# 静的配信だけで完結していたため、この1行を追加しない限りクローラーへ出し分ける方法が無かった。
# 実際の人間のブラウザは、Worker内でクローラー判定に外れた場合にenv.ASSETS.fetch(request)へ
# フォールスルーすることで、従来と全く同じ完全なSPA体験（ResultShareLandingScreen.tsx・
# resolveShareLandingDestination()の差し込み点つき）を引き続き受け取る——挙動は変えない。
run_worker_first = ["/api/*", "/s/*"]

[previews]

# Ver.6 Phase 5.2（Challenge機能完成・バグ修正）: Challengeバックエンド用D1データベース
# （Preview専用、Productionとは完全に分離した名前・バインディング）。
#
# 重要: このファイルに[previews]テーブルが存在する場合、`wrangler preview`は
# トップレベルの[[d1_databases]]を一切継承しない（wrangler本体の仕様。
# "Assets, compatibility settings, migrations, and placement stay at the top
# level"だが、D1などのbindingはpreviewsブロックに明示しないとPreview Workerへ
# 渡らない）。そのため、GitHub Actions（.github/workflows/cloudflare-preview-ver6.yml）
# は、Preview D1データベース作成直後に[[previews.d1_databases]]ブロックを
# このファイルのコピーへ一時的に追記してから`wrangler preview`を実行する
# （database_idはCI実行ごとに動的取得し、このリポジトリには固定で書き込まない）。
#
# [[previews.d1_databases]]
# binding = "CHALLENGE_DB"
# database_name = "dopagaki-challenges-preview"
# database_id = "<CI実行時にCloudflare D1 REST APIから取得した値>"

# Ver.6 Phase 6（1対1リアルタイム対戦）: Durable Object（Matchmaker・BattleRoom）。
# D1と異なりCloudflare API経由での事前作成は不要（class_nameをexportしてmigrationsタグを
# 付けるだけで、wrangler preview/deploy時に自動的にプロビジョニングされる）。
# ただし[previews]テーブルが存在する場合、トップレベルのbindingはここでも継承されない
# （D1と同じ既知の挙動）ため、previews.durable_objects.bindingsにも明示的に複製する。
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "BATTLE_ROOM"
class_name = "BattleRoom"

# 次フェーズ（DOPA PASS基盤ラウンド、item 15 PRIVATE ROOM）: ロビーを管理する新規Durable Object。
[[durable_objects.bindings]]
name = "PRIVATE_ROOM"
class_name = "PrivateRoom"

# 次フェーズ（FRIENDS/ナビ刷新ラウンド、item 28）: プレゼンス（ONLINE/PLAYING）を管理する
# 単一グローバルDurable Object（Matchmakerと同じidFromName('global')パターン）。
[[durable_objects.bindings]]
name = "PRESENCE_HUB"
class_name = "PresenceHub"

[[previews.durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[previews.durable_objects.bindings]]
name = "BATTLE_ROOM"
class_name = "BattleRoom"

[[previews.durable_objects.bindings]]
name = "PRIVATE_ROOM"
class_name = "PrivateRoom"

[[previews.durable_objects.bindings]]
name = "PRESENCE_HUB"
class_name = "PresenceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "BattleRoom"]

# 新しいDurable Objectクラスを既存タグ（v1）へ後から混ぜることはCloudflareが許可しないため、
# 専用の新しいタグを追加する。
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PrivateRoom"]

# 次フェーズ（FRIENDS/ナビ刷新ラウンド、item 28）: 同じ理由でPresenceHubも専用の新タグ。
[[migrations]]
tag = "v3"
new_sqlite_classes = ["PresenceHub"]
